name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Locate project (newest zip, any name)
        id: locate
        shell: bash
        run: |
          set -e
          BEST=""; BEST_T=0
          while IFS= read -r f; do
            t=$(git log -1 --format=%ct -- "$f")
            if [ "$t" -ge "$BEST_T" ]; then BEST="$f"; BEST_T="$t"; fi
          done < <(git -c core.quotePath=false ls-files '*.zip')

          if [ -n "$BEST" ]; then
            echo "Using zip: $BEST"
            mkdir -p _project
            unzip -q -o "$BEST" -d _project
            ROOT=_project
          else
            echo "No zip found, using repository files directly"
            ROOT=.
          fi

          SETTINGS=$(find "$ROOT" -maxdepth 4 \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) \
            | awk '{print gsub("/","/") " " $0}' | sort -n | head -n1 | cut -d' ' -f2-)
          if [ -z "$SETTINGS" ]; then
            echo "::error::No settings.gradle(.kts) found"
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "Project dir: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

          GV=""
          PROPS="$DIR/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$PROPS" ]; then
            GV=$(grep '^distributionUrl' "$PROPS" | sed -E 's/.*gradle-([0-9][0-9A-Za-z.-]*)-(bin|all)\.zip.*/\1/')
          fi
          [ -n "$GV" ] || GV="9.6.0"
          echo "Gradle version: $GV"
          echo "gradle=$GV" >> "$GITHUB_OUTPUT"

          # We build with the Gradle installed by setup-gradle, not gradlew,
          # so drop any wrapper jar (a non-official jar fails validation).
          find . -name 'gradle-wrapper.jar' -not -path './.git/*' -print -delete

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ steps.locate.outputs.gradle }}

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: focuslock-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
